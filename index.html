<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Interactive logic gates: symbols, truth tables and Boolean expressions.">

    <title>Logic Gates | Interactive Truth Tables</title>

    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/main.js"></script>
</head>
<body>
    <header class="page-header">
        <div>
            <span class="eyebrow">INTERACTIVE LEARNING</span>
            <h1>Logic <span class="accent">gates</span></h1>
            <p>Select a gate, change its inputs and watch the output.</p>
        </div>
        <span class="section-count" id="gate-count"></span>
    </header>

    <main>
        <div class="gate-grid" id="gate-selector"></div>

        <p class="hint" id="gate-hint">Select a gate card to start.</p>

        <section class="gate-panel" id="gate-panel" hidden>
            <div>
                <span class="eyebrow">INTERACTIVE GATE</span>
                <h2 id="gate-title"></h2>
            </div>

            <div id="gate-symbol"></div>
            <p class="expression" id="gate-expression"></p>
            <div id="gate-inputs"></div>
            <p id="gate-output" aria-live="polite"></p>

            <button class="table-toggle" id="table-toggle" type="button" aria-expanded="false">
                Show truth table
            </button>
            <div id="truth-table" hidden></div>
        </section>
    </main>
</body>
</html>
